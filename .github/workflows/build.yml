name: Build

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "v*"

  workflow_call:

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      kicad_version: ${{ steps.v.outputs.kicad_version }}
    steps:
      - uses: actions/checkout@v7
      - name: KiCad Version
        id: v
        run: |
          echo "kicad_version=$(tr -d '[:space:]' < .github/kicad-version)" >> "$GITHUB_OUTPUT"

  build:
    needs: setup
    name: Generate Artifacts
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/kicad/kicad:${{ needs.setup.outputs.kicad_version }}
      options: --user root
    steps:
      - name: Install Packages
        run: |
          apt-get update && apt-get install -y zip python3-pip xvfb
          pip install --break-system-packages InteractiveHtmlBom==2.12.0
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Seed KiCad Global Library Tables
        run: |
          mkdir -p $HOME/.config/kicad/${{ needs.setup.outputs.kicad_version }}
          cp /usr/share/kicad/template/*-lib-table $HOME/.config/kicad/${{ needs.setup.outputs.kicad_version }}
      - name: Run ERC
        run: |
          mkdir -p logs/
          kicad-cli sch erc --output logs/erc.json --format json --exit-code-violations xblast-lite.kicad_sch
      - name: Run DRC
        run: |
          mkdir -p logs/
          kicad-cli pcb drc --output logs/drc.json --format json --exit-code-violations xblast-lite.kicad_pcb
      - name: Create Schematic PDF
        run: |
          mkdir -p outputs/
          kicad-cli sch export pdf --output outputs/xblast-lite.schematic.pdf xblast-lite.kicad_sch
      - name: Create BOM
        run: |
          mkdir -p outputs/
          kicad-cli sch export bom --output outputs/xblast-lite.bom.csv xblast-lite.kicad_sch
      - name: Create Interactive BOM
        run: |
          mkdir -p outputs/
          xvfb-run -a generate_interactive_bom \
            --no-browser \
            --dest-dir "$PWD/outputs" \
            --name-format "%f.ibom" \
            xblast-lite.kicad_pcb
      - name: Generate Gerbers
        run: |
          mkdir -p tmp
          mkdir -p outputs/
          kicad-cli pcb export gerbers --output tmp/ xblast-lite.kicad_pcb
          kicad-cli pcb export drill --output tmp/ xblast-lite.kicad_pcb
          cd tmp
          zip ../outputs/xblast-lite.gerbers.zip *
      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: outputs
          path: outputs/
          retention-days: 1
      - name: Upload Logs on Failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: logs
          path: logs/
          retention-days: 1

  deploy:
    name: Deploy iBOM to Pages
    needs: build
    if: ${{ github.ref == 'refs/heads/master' || github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: gh-pages-deploy
      cancel-in-progress: false
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          name: outputs
          path: outputs/
      - name: Prepare Site
        run: |
          mkdir site
          cp outputs/xblast-lite.ibom.html site/index.html
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site
          destination_dir: ${{ github.ref_type == 'tag' && github.ref_name || 'master' }}
          keep_files: true